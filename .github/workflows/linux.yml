# Сборка WhoKey для Linux на компьютере GitHub. Шаги: проверки → сборка → запуск собранной
# программы и моста → установка и удаление. Ubuntu 22.04 — самая старая система, на которой
# есть подходящий Qt (glibc 2.34+): собранное на ней работает и на более новых.
name: Linux build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libglib2.0-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            netcat-openbsd binutils

      - name: Install libraries
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover tests -v

      - name: Smoke test (vault, windows)
        run: python tests/smoke_test.py shots

      - name: Build package
        run: python build_linux.py

      - name: Check the built program and its bridge
        run: |
          export HOME="$(mktemp -d)" XDG_RUNTIME_DIR="$(mktemp -d)"
          dist/WhoKey/WhoKey &
          first=$!
          sleep 8
          kill -0 "$first"
          dist/WhoKey/WhoKey   # вторая копия передаёт окно первой и выходит
          kill -0 "$first"
          kill "$first"
          python tests/host_mode_check.py dist/WhoKey/WhoKey

      - name: Install, run, uninstall
        run: |
          # не в /tmp: из временной папки WhoKey мост в браузерах не прописывает
          export HOME="$(mktemp -d -p "$RUNNER_TEMP")" XDG_RUNTIME_DIR="$(mktemp -d)"
          mkdir -p "$HOME/.config/chromium" unpacked
          tar xf dist/WhoKey-linux-x86_64.tar.gz -C unpacked
          sh unpacked/WhoKey/install.sh
          "$HOME/.local/bin/whokey" &
          app=$!
          sleep 8
          kill -0 "$app"
          grep -q "$HOME/.local/opt/WhoKey/WhoKey" "$HOME/.config/chromium/NativeMessagingHosts/ru.edu.whokey.json"
          kill "$app"
          sleep 2
          sh "$HOME/.local/opt/WhoKey/uninstall.sh"
          test ! -e "$HOME/.local/opt/WhoKey"

      - uses: actions/upload-artifact@v4
        with:
          name: WhoKey-Linux
          path: dist/WhoKey-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: shots/
