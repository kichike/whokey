# Сборка WhoKey для Windows на компьютере GitHub (у нас самих Windows нет).
# Шаги: проверки → WhoKey.exe → проверка, что .exe запускается → установщик →
# тихая установка, запуск установленной программы и удаление.
# Результат (установщик и снимки окон) — во вкладке Actions, раздел Artifacts.
name: Windows build

on:
  workflow_dispatch:       # запуск вручную: Actions → Windows build → Run workflow
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # иначе Python в консоли Windows (cp1252) не печатает русские буквы
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # та же версия, что на Mac

      - name: Install libraries
        run: python -m pip install -r requirements.txt

      - name: Smoke test (vault, clipboard, windows)
        run: python tests/smoke_test.py shots

      - name: Build WhoKey.exe
        run: python build_windows.py

      - name: Check that WhoKey.exe starts and keeps running
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\WhoKey\WhoKey.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "WhoKey.exe exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Write-Host "WhoKey.exe is running fine"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # оформлению нужен Inno Setup 6.7+ — ставим/обновляем до последней версии
          choco upgrade innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          Write-Host "Inno Setup: $((Get-Item $iscc).VersionInfo.ProductVersion)"
          & $iscc /Q installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Install silently, run, uninstall
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath "dist\WhoKey Installer.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "installer exited with code $($setup.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\WhoKey\WhoKey.exe"
          if (-not (Test-Path $exe)) { throw "WhoKey.exe not installed" }
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\WhoKey.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut missing" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "installed WhoKey exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Start-Sleep -Seconds 2
          $un = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\WhoKey\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -PassThru -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "uninstall left WhoKey.exe behind" }
          Write-Host "install / run / uninstall OK"

      - name: Screenshots of the installer pages
        continue-on-error: true   # снимки — для глаз, сборку не валят
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Snap($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\installer_$name.png")
          }
          $p = Start-Process -FilePath "dist\WhoKey Installer.exe" -ArgumentList "/LANG=ru","/CURRENTUSER" -PassThru
          $ws = New-Object -ComObject WScript.Shell
          # приветствие → папка → ярлыки → готово к установке → (установка) → завершение
          foreach ($page in 1..5) {
            Start-Sleep -Seconds 4
            Snap $page
            $null = $ws.AppActivate($p.Id)
            Start-Sleep -Milliseconds 300
            $ws.SendKeys("{ENTER}")
          }
          Start-Sleep -Seconds 4
          Get-Process WhoKey -ErrorAction SilentlyContinue | Stop-Process
          if (-not $p.HasExited) { Stop-Process -Id $p.Id }

      - uses: actions/upload-artifact@v4
        with:
          name: WhoKey-Windows
          path: dist/WhoKey Installer.exe

      - uses: actions/upload-artifact@v4
        if: always()             # снимки окон нужны и когда что-то упало
        with:
          name: screenshots
          path: shots/
